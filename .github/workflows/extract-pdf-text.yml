name: extract-pdf-text-for-bilingual
on:
  push:
    branches: [feature/ccarf-bilingual-reading-20261122]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract text from existing source PDFs
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v pdftotext >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y poppler-utils
          fi
          mkdir -p /tmp/ccarf-extracted
          find . -type f -iname '*.pdf' -print0 | while IFS= read -r -d '' file; do
            base="${file##*/}"
            pdftotext -layout -enc UTF-8 "$file" "/tmp/ccarf-extracted/${base%.pdf}.txt" || echo "FAILED: $file"
          done
          echo "Extracted $(find /tmp/ccarf-extracted -type f | wc -l) documents"
      - name: Upload PDF text as temporary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ccarf-pdf-text-for-bilingual
          path: /tmp/ccarf-extracted/
          retention-days: 1
